<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
    body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }
    h1 {
        color: #333;
    }
    .choices {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }
    button {
        font-size: 1.5rem;
        padding: 10px 20px;
        cursor: pointer;
        background-color: #fff;
        border: 2px solid #ccc;
        border-radius: 8px;
        transition: background-color 0.3s, transform 0.1s;
    }
    button:hover {
        background-color: #e0e0e0;
    }
    button:active {
        transform: scale(0.95);
    }
    .result {
        font-size: 1.2rem;
        text-align: center;
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        min-width: 300px;
    }
    .score {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Rock Paper Scissors</h1>

<div class="choices">
    <button onclick="playGame('rock')">✊ Rock</button>
    <button onclick="playGame('paper')">✋ Paper</button>
    <button onclick="playGame('scissors')">✌️ Scissors</button>
</div>

<div class="result">
    <div id="message">Make your choice to start the game!</div>
    <div class="score">Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span> | Ties: <span id="ties">0</span></div>
</div>

<script>
    let wins = 0;
    let losses = 0;
    let ties = 0;

    function getComputerChoice() {
        const choices = ['rock', 'paper', 'scissors'];
        const randomIndex = Math.floor(Math.random() * choices.length);
        return choices[randomIndex];
    }

    function determineWinner(playerChoice, computerChoice) {
        if (playerChoice === computerChoice) {
            return 'tie';
        }
        if (
            (playerChoice === 'rock' && computerChoice === 'scissors') ||
            (playerChoice === 'paper' && computerChoice === 'rock') ||
            (playerChoice === 'scissors' && computerChoice === 'paper')
        ) {
            return 'win';
        }
        return 'lose';
    }

    function updateScoreDisplay() {
        document.getElementById('wins').textContent = wins;
        document.getElementById('losses').textContent = losses;
        document.getElementById('ties').textContent = ties;
    }

    function playGame(playerChoice) {
        const computerChoice = getComputerChoice();
        const result = determineWinner(playerChoice, computerChoice);

        let resultMessage = `You chose ${playerChoice}, computer chose ${computerChoice}. `;

        if (result === 'win') {
            wins++;
            resultMessage += '<strong>You win! 🎉</strong>';
        } else if (result === 'lose') {
            losses++;
            resultMessage += '<strong>You lose! 😢</strong>';
        } else {
            ties++;
            resultMessage += '<strong>It\'s a tie! 🤝</strong>';
        }

        document.getElementById('message').innerHTML = resultMessage;
        updateScoreDisplay();
    }
</script>

</body>
</html>
